<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0404"/>
      <stop offset="50%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ff0000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Outer pulse ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,0,0,0.22)" stroke-width="6" stroke-dasharray="14 10"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  
  <!-- YouTube Plate -->
  <rect x="116" y="146" width="280" height="220" rx="54" fill="url(#redGlow)" filter="url(#shadow)"/>
  
  <!-- Play Triangle -->
  <polygon points="230,205 316,256 230,307" fill="#ffffff"/>
  
  <!-- Live Signal Indicator -->
  <circle cx="360" cy="180" r="14" fill="#00ff66"/>
  <circle cx="360" cy="180" r="22" fill="none" stroke="#00ff66" stroke-width="3" opacity="0.6"/>
</svg>
